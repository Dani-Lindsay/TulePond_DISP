# Common PyLith 5.0.2 settings of the Tule Pond Green's-function and forward runs (vertical and dipping faults).
# Patterned on examples/crustal-strikeslip-3d/pylithapp.cfg and examples/subduction-3d/pylithapp.cfg.
# Run from the results directory data_dir (pylith/run_gf.sh, run_fwd.sh; pylith/README.md):
#   pylith <cfg>/pylithapp.cfg <cfg>/mat_<medium>.cfg <cfg>/gf.cfg [overrides]
# Every file path below is relative to data_dir (modeling_inputs/, modeling_uniform/, modeling_SFCVM/).
[pylithapp.metadata]
description = Tule Pond section of the Hayward Fault: slip impulses on the fault, displacements at the InSAR quadtree samples
pylith_version = [>=5.0, <6.0]
authors = [Danielle Lindsay]
keywords = [Green's functions, Hayward fault, SFCVM]
arguments = [cfg/pylithapp.cfg, cfg/mat_homog.cfg or cfg/mat_sfcvm.cfg, cfg/gf.cfg]
version = 0.1.0
features = [pylith.problems.GreensFns, pylith.faults.FaultCohesiveImpulses, pylith.meshio.OutputSolnPoints]

[pylithapp.journal]
device = color-console

[pylithapp.problem.mesh_initializer.phases.read_mesh]
reader = pylith.meshio.MeshIOPetsc
reader.filename = modeling_inputs/mesh/mesh_vertical_tet_default.msh
reader.coordsys = spatialdata.geocoords.CSGeo
reader.coordsys.crs_string = +proj=tmerc +datum=WGS84 +lon_0=-121.968 +lat_0=37.557 +k=1 +units=m +type=crs
reader.coordsys.space_dim = 3

[pylithapp.problem]
defaults.quadrature_order = 1
# The output directory is set by the material cfg (mat_homog.cfg -> modeling_uniform/pylith_output, mat_sfcvm*.cfg ->
# modeling_SFCVM/pylith_output).
solution = pylith.problems.SolnDispLagrange

[pylithapp.problem.scales]
# PyLith v5.0.2 guidance: length scale ~ discretization size on the fault (preconditioner)
length_scale = 100.0*m
displacement_scale = 1.0*m
shear_modulus = 10.0*GPa

[pylithapp.problem.solution.subfields]
displacement.basis_order = 1
lagrange_multiplier_fault.basis_order = 1

# ----------------------------------------------------------------------
# material: one volume (tag 1); properties from mat_homog.cfg or mat_sfcvm.cfg
[pylithapp.problem]
materials = [elastic]

[pylithapp.problem.materials.elastic]
label_value = 1
auxiliary_subfields.density.basis_order = 0
bulk_rheology.auxiliary_subfields.bulk_modulus.basis_order = 0
bulk_rheology.auxiliary_subfields.shear_modulus.basis_order = 0
derived_subfields.cauchy_strain.basis_order = 0
derived_subfields.cauchy_stress.basis_order = 0
observers.observer.data_fields = [displacement]
observers.observer.trigger.num_skip = 1000000

# ----------------------------------------------------------------------
# boundary conditions: all displacement components fixed on the sides and bottom; free top
[pylithapp.problem]
bc = [bc_xneg, bc_xpos, bc_yneg, bc_ypos, bc_zneg]

[pylithapp.problem.bc.bc_xneg]
label = boundary_xneg
label_value = 10
constrained_dof = [0, 1, 2]
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC on -x

[pylithapp.problem.bc.bc_xpos]
label = boundary_xpos
label_value = 11
constrained_dof = [0, 1, 2]
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC on +x

[pylithapp.problem.bc.bc_yneg]
label = boundary_yneg
label_value = 12
constrained_dof = [0, 1, 2]
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC on -y

[pylithapp.problem.bc.bc_ypos]
label = boundary_ypos
label_value = 13
constrained_dof = [0, 1, 2]
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC on +y

[pylithapp.problem.bc.bc_zneg]
label = boundary_zneg
label_value = 14
constrained_dof = [0, 1, 2]
db_auxiliary_field = pylith.bc.ZeroDB
db_auxiliary_field.description = Dirichlet BC on -z

[pylithapp.problem.bc.bc_xneg]
observers.observer.trigger.num_skip = 1000000

[pylithapp.problem.bc.bc_xpos]
observers.observer.trigger.num_skip = 1000000

[pylithapp.problem.bc.bc_yneg]
observers.observer.trigger.num_skip = 1000000

[pylithapp.problem.bc.bc_ypos]
observers.observer.trigger.num_skip = 1000000

[pylithapp.problem.bc.bc_zneg]
observers.observer.trigger.num_skip = 1000000
