# Quadratic solution (displacement and fault Lagrange multiplier basis order 2, quadrature order 2 as in
# examples/strikeslip-2d/step04_varslip.cfg and subduction-3d/step08a) to limit volumetric locking in the
# near-incompressible sediment; materials linear within a cell (basis order 1); the slip impulses remain basis order 1
# (tents at the fault vertices, inverted with CSI TriangularTents).
# Use after gf.cfg:  pylith <cfg>/pylithapp.cfg <cfg>/mat_<medium>.cfg <cfg>/gf.cfg <cfg>/order2.cfg ...  (pylith/run_gf.sh ... order2.cfg)
[pylithapp.problem]
defaults.quadrature_order = 2

[pylithapp.problem.solution.subfields]
displacement.basis_order = 2
lagrange_multiplier_fault.basis_order = 2

[pylithapp.problem.interfaces.fault]
auxiliary_subfields.slip.basis_order = 1

[pylithapp.problem.materials.elastic]
auxiliary_subfields.density.basis_order = 1
bulk_rheology.auxiliary_subfields.bulk_modulus.basis_order = 1
bulk_rheology.auxiliary_subfields.shear_modulus.basis_order = 1
