# USGS SFCVM v26.0 aligned with the block boundary 50 m WEST of the trace (alignment sensitivity, 
# pylith/build/sfcvm_grid.py --offset -50 + write_sfcvm_griddb.py). SimpleGridDB, linear. No Vs floor, NO Poisson cap (the order-2
# runs: Charles Williams 2026-09-29).
[pylithapp.problem.materials.elastic]
db_auxiliary_field = spatialdata.spatialdb.SimpleGridDB
db_auxiliary_field.description = SFCVM v26.0 aligned, boundary offset (w50), no Poisson cap
db_auxiliary_field.filename = modeling_SFCVM/spatialdb/mat_sfcvm_v26-0_aligned_nocap_w50.spatialdb
db_auxiliary_field.query_type = linear

# results of the SFCVM media (relative to data_dir; 2026-10-06 layout) [NO Poisson cap, for order-2 runs: Charles Williams 2026-09-29]
[pylithapp.problem]
defaults.output_directory = modeling_SFCVM/pylith_output
