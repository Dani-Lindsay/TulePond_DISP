# USGS SFCVM v26.0 aligned with the block boundary 50 m west of the trace (alignment sensitivity test,
# pylith/build/sfcvm_grid.py --offset -50 --no-cap + write_sfcvm_griddb.py). SimpleGridDB, linear. No Vs floor, no Poisson
# cap (order-2 runs).
[pylithapp.problem.materials.elastic]
db_auxiliary_field = spatialdata.spatialdb.SimpleGridDB
db_auxiliary_field.description = SFCVM v26.0 aligned, boundary offset (w50), no Poisson cap
db_auxiliary_field.filename = modeling_SFCVM/spatialdb/mat_sfcvm_v26-0_aligned_nocap_w50.spatialdb
db_auxiliary_field.query_type = linear

# results of the SFCVM media (relative to data_dir)
[pylithapp.problem]
defaults.output_directory = modeling_SFCVM/pylith_output
