# Forward run of an INVERTED vertex-slip model (SimpleDB, nearest) at the Fig-2 profile points + samples (notebook 08a [14]; until 2026-09-30 drafts/pylith/make_fig2_product.py).
# Patterned on examples/crustal-strikeslip-3d/step01_slip.cfg (FaultCohesiveKin, KinSrcStep default).
[pylithapp.problem]
solution_observers = [points]
solution_observers.points = pylith.meshio.OutputSolnPoints
interfaces = [fault]

[pylithapp.problem.solution_observers.points]
label = insar
data_fields = [displacement]
reader.filename = modeling_inputs/points/insar_points.txt
reader.coordsys = spatialdata.geocoords.CSGeo
reader.coordsys.crs_string = +proj=tmerc +datum=WGS84 +lon_0=-121.968 +lat_0=37.557 +k=1 +units=m +type=crs
reader.coordsys.space_dim = 3

[pylithapp.problem.interfaces.fault]
label = fault
label_value = 20
observers.observer.data_fields = [slip]

[pylithapp.problem.interfaces.fault.eq_ruptures.rupture]
db_auxiliary_field = spatialdata.spatialdb.SimpleDB
db_auxiliary_field.description = Inverted vertex slip (notebook 08a [14]; until 2026-09-30 drafts/pylith/make_fig2_product.py)
db_auxiliary_field.iohandler.filename = modeling_SFCVM/spatialdb/fig2_slip_nuggetcd.spatialdb
# (always overridden on the command line by notebook 08a with the slip db of the model it runs forward)
db_auxiliary_field.query_type = nearest
