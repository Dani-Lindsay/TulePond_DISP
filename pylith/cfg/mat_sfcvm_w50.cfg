# USGS SFCVM v26.0 aligned with the block boundary 50 m west of the trace (alignment sensitivity test, order-1 runs;
# pylith/build/sfcvm_grid.py --offset -50 + write_sfcvm_griddb.py). SimpleGridDB, linear, one value per cell.
[pylithapp.problem.materials.elastic]
db_auxiliary_field = spatialdata.spatialdb.SimpleGridDB
db_auxiliary_field.description = SFCVM v26.0 aligned, boundary offset (w50)
db_auxiliary_field.filename = modeling_SFCVM/spatialdb/mat_sfcvm_v26-0_aligned_w50.spatialdb
db_auxiliary_field.query_type = linear

# results of the SFCVM media (relative to data_dir)
[pylithapp.problem]
defaults.output_directory = modeling_SFCVM/pylith_output
