# USGS SFCVM v26.0, AS IS (not aligned; sensitivity run) (pylith/build/sfcvm_grid.py + write_sfcvm_griddb.py): SimpleGridDB, [NO Poisson cap, for order-2 runs: Charles Williams 2026-09-29]
# linear interpolation between grid points, one value per cell (basis order 0, set in pylithapp.cfg). [NO Poisson cap, for order-2 runs: Charles Williams 2026-09-29]
# vs floored at 150 m/s, Poisson's ratio capped at 0.40 (vp = min(vp, sqrt(6) vs)). [NO Poisson cap, for order-2 runs: Charles Williams 2026-09-29]
[pylithapp.problem.materials.elastic]
db_auxiliary_field = spatialdata.spatialdb.SimpleGridDB
db_auxiliary_field.description = SFCVM v26.0 as is, no Poisson cap
db_auxiliary_field.filename = modeling_SFCVM/spatialdb/mat_sfcvm_v26-0_asis_nocap.spatialdb
db_auxiliary_field.query_type = linear

# results of the SFCVM media (relative to data_dir; 2026-10-06 layout) [NO Poisson cap, for order-2 runs: Charles Williams 2026-09-29]
[pylithapp.problem]
defaults.output_directory = modeling_SFCVM/pylith_output
