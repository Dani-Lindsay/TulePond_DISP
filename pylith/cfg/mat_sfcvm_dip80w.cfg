# USGS SFCVM v26.0 aligned to the DIPPING mesh fault (dip 80w, WEST: geologically implausible sensitivity only;
# pylith/build/sfcvm_grid.py --dip 80w + write_sfcvm_griddb.py). SimpleGridDB, linear interpolation, one value per cell.
[pylithapp.problem.materials.elastic]
db_auxiliary_field = spatialdata.spatialdb.SimpleGridDB
db_auxiliary_field.description = SFCVM v26.0 aligned to the dip 80w fault (sensitivity)
db_auxiliary_field.filename = modeling_SFCVM/spatialdb/mat_sfcvm_v26-0_aligned_dip80w.spatialdb
db_auxiliary_field.query_type = linear

# results of the SFCVM media (relative to data_dir; 2026-10-06 layout)
[pylithapp.problem]
defaults.output_directory = modeling_SFCVM/pylith_output
