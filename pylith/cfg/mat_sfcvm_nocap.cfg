# USGS SFCVM v26.0 aligned on the mapped trace (pylith/build/sfcvm_grid.py --no-cap + write_sfcvm_griddb.py), without
# the Poisson cap and with no Vs floor: the material model of the order-2 runs, including the preferred model
# gf_shallow_dip70w_sfcvm_order2 and the dip sensitivity tests. With quadratic elements the near-incompressible
# sediment does not require the cap.
[pylithapp.problem.materials.elastic]
db_auxiliary_field = spatialdata.spatialdb.SimpleGridDB
db_auxiliary_field.description = SFCVM v26.0 aligned, no Poisson cap
db_auxiliary_field.filename = modeling_SFCVM/spatialdb/mat_sfcvm_v26-0_aligned_nocap.spatialdb
db_auxiliary_field.query_type = linear

# results of the SFCVM media (relative to data_dir)
[pylithapp.problem]
defaults.output_directory = modeling_SFCVM/pylith_output
