# USGS SFCVM v26.0 aligned per depth to the VERTICAL mesh fault (control: the block boundary held on the fault at every
# depth, instead of shifting columns whole; pylith/build/sfcvm_grid.py --dip 90v + write_sfcvm_griddb.py). SimpleGridDB, linear.
[pylithapp.problem.materials.elastic]
db_auxiliary_field = spatialdata.spatialdb.SimpleGridDB
db_auxiliary_field.description = SFCVM v26.0 aligned per depth to the vertical fault (control)
db_auxiliary_field.filename = modeling_SFCVM/spatialdb/mat_sfcvm_v26-0_aligned_dip90v.spatialdb
db_auxiliary_field.query_type = linear

# results of the SFCVM media (relative to data_dir; 2026-10-06 layout)
[pylithapp.problem]
defaults.output_directory = modeling_SFCVM/pylith_output
