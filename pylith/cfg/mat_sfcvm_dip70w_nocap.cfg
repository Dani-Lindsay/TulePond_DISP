# USGS SFCVM v26.0 aligned on the DIPPING 70 W fault at every depth level (pylith/build/sfcvm_grid.py --no-cap --dip 70w
# + write_sfcvm_griddb.py), without the Poisson cap and with no Vs floor. The test of the preferred model's material
# geometry: in mat_sfcvm_nocap.cfg each SFCVM column is shifted as a whole, so the model's east-dipping block boundary
# meets the 70 W fault only near the surface (audit 2026-11-03); here the boundary follows the fault to 3 km.
[pylithapp.problem.materials.elastic]
db_auxiliary_field = spatialdata.spatialdb.SimpleGridDB
db_auxiliary_field.description = SFCVM v26.0 aligned on the 70 W fault, no Poisson cap
db_auxiliary_field.filename = modeling_SFCVM/spatialdb/mat_sfcvm_v26-0_aligned_dip70w_nocap.spatialdb
db_auxiliary_field.query_type = linear

# results of the SFCVM media (relative to data_dir)
[pylithapp.problem]
defaults.output_directory = modeling_SFCVM/pylith_output
