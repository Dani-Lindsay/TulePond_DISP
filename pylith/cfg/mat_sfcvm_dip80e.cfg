# USGS SFCVM v26.0 aligned to the DIPPING mesh fault (dip 80e; pylith/build/sfcvm_grid.py --dip 80e + write_sfcvm_griddb.py): the
# {22|23}|7 block boundary moved onto the fault at every depth. SimpleGridDB, linear interpolation, one value per cell.
[pylithapp.problem.materials.elastic]
db_auxiliary_field = spatialdata.spatialdb.SimpleGridDB
db_auxiliary_field.description = SFCVM v26.0 aligned to the dip 80e fault
db_auxiliary_field.filename = modeling_SFCVM/spatialdb/mat_sfcvm_v26-0_aligned_dip80e.spatialdb
db_auxiliary_field.query_type = linear

# results of the SFCVM media (relative to data_dir; 2026-10-06 layout)
[pylithapp.problem]
defaults.output_directory = modeling_SFCVM/pylith_output
