# Green's functions: right-lateral is -1 x left-lateral, so impulses in the left-lateral component (dof 1) only.
# Patterned on examples/subduction-3d/step07a_leftlateral.cfg and examples/strikeslip-2d/step05_greensfns.cfg.
[pylithapp]
problem = pylith.problems.GreensFns

[pylithapp.greensfns]
label = fault
label_value = 20

[pylithapp.problem]
solution_observers = [points]
solution_observers.points = pylith.meshio.OutputSolnPoints

[pylithapp.problem.solution_observers.points]
label = insar
data_fields = [displacement]
reader.filename = modeling_inputs/points/insar_points.txt
reader.coordsys = spatialdata.geocoords.CSGeo
reader.coordsys.crs_string = +proj=tmerc +datum=WGS84 +lon_0=-121.968 +lat_0=37.557 +k=1 +units=m +type=crs
reader.coordsys.space_dim = 3

[pylithapp.problem]
interfaces = [fault]
interfaces.fault = pylith.faults.FaultCohesiveImpulses

[pylithapp.problem.interfaces.fault]
label = fault
label_value = 20
impulse_dof = [1]
threshold = 0.5*m
observers.observer.data_fields = [slip]
db_auxiliary_field = spatialdata.spatialdb.SimpleGridDB
db_auxiliary_field.description = Impulse region
db_auxiliary_field.filename = modeling_inputs/spatialdb/impulses_km54-65_z3000.spatialdb
# (until 2026-10-06 the default was the 20-impulse test db impulses_test20.spatialdb; every production run overrode it
#  on the command line with the km 54-65 db, as pylith/run_gf.sh still does)
# "Currently, only basis order = 1 results in appropriate output for inversion." (PyLith examples)
auxiliary_subfields.slip.basis_order = 1
