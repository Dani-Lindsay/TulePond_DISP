# USGS SFCVM v26.0 as is (not aligned; sensitivity test) (pylith/build/sfcvm_grid.py + write_sfcvm_griddb.py): SimpleGridDB,
# linear interpolation between grid points, one value per cell (basis order 0, set in pylithapp.cfg).
# No Vs floor; Poisson's ratio capped at 0.40 (vp = min(vp, sqrt(6) vs)). For order-1 runs only.
[pylithapp.problem.materials.elastic]
db_auxiliary_field = spatialdata.spatialdb.SimpleGridDB
db_auxiliary_field.description = SFCVM v26.0 as is
db_auxiliary_field.filename = modeling_SFCVM/spatialdb/mat_sfcvm_v26-0_asis.spatialdb
db_auxiliary_field.query_type = linear

# results of the SFCVM media (relative to data_dir)
[pylithapp.problem]
defaults.output_directory = modeling_SFCVM/pylith_output
