# Homogeneous reference medium: mu = rho vs^2 = 30 GPa, Poisson's ratio 0.25 (vp = sqrt(3) vs), as the CSI baseline.
[pylithapp.problem.materials.elastic]
db_auxiliary_field = spatialdata.spatialdb.UniformDB
db_auxiliary_field.description = Homogeneous elastic properties (30 GPa, nu 0.25)
db_auxiliary_field.values = [density, vs, vp]
db_auxiliary_field.data = [2700.0*kg/m**3, 3333.3333333*m/s, 5773.5026919*m/s]

# results of the homogeneous medium (relative to data_dir; 2026-10-06 layout)
[pylithapp.problem]
defaults.output_directory = modeling_uniform/pylith_output
