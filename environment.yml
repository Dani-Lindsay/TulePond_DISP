# Conda environment for the TulePond_DISP notebooks (the working env is called
# opera_disp_feb13; this is the subset of it the repo imports). Pinned to the
# major.minor versions the paper numbers were produced with (2026-09-25);
# environment_full_2026-09-25.yml is the exact export of the working env
# (macOS arm64 builds) if a byte-for-byte copy is wanted.
#
#   conda env create -n opera_disp_feb13 -f environment.yml
#   python -m pytest -q          # 115 tests; anchors skip until the notebooks have run
#
# Notebooks 08, 09 and 10 (alignment arrays, rain, forecast) need only numpy,
# pandas, scipy and matplotlib; 01 to 06 need the MintPy / h5py / pygmt stack.
name: opera_disp_feb13
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.4
  - pandas=2.2
  - scipy=1.17
  - matplotlib=3.10
  - cmcrameri             # Crameri scientific colour maps (notebooks 09 and 14)
  - h5py=3.15
  - xarray
  - pyproj=3.7
  - shapely=2.1          # notebook 06: burst seams from the CSLC static bounding polygons
  - geopandas=1.1        # notebook 14: the USGS Quaternary faults of the Fig 1 locator map
  - gmt=6.6
  - pygmt=0.18
  - geopy
  - fonttools
  - mintpy>=1.6
  - jupyterlab
  - nbconvert
  - ipykernel
  - pytest
  - pip
  - pip:
      - jupytext==1.19.5
