# Conda environment of the TulePond_DISP notebooks, data preparation and tests, pinned to the versions the paper's
# numbers were produced with (macOS arm64, Nov 2026):
#
#   conda env create -f environment.yml
#   conda activate tulepond_disp
#   pip install --no-deps git+https://github.com/jolivetr/csi@1277bb4    # CSI (slip models), not on conda-forge or PyPI
#   python -m pytest -q          # set TULEPOND_DATA_DIR first (the anchors read its registry)
#
# PyLith 5.0.2 runs from its own binary bundle (pylith/README.md), not from this environment.
name: tulepond_disp
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.4
  - pandas=2.2
  - scipy=1.17
  - matplotlib=3.10
  - cmcrameri=1.9         # Crameri scientific colour maps (notebooks 09 and 14)
  - h5py=3.15
  - xarray=2026.1
  - pyproj=3.7
  - shapely=2.1          # notebook 06: burst seams from the CSLC static bounding polygons
  - gmt=6.6
  - pygmt=0.18
  - geopy=2.5           # notebook 15 (the 2025 script) and tests/test_filepaths.py
  - fonttools
  - mintpy=1.6.3          # asc_desc2horz_vert (02, 06), time_func (06), ptime (01): these modules are identical in 1.6.2 and 1.6.3
  - rasterio=1.5         # the LOS ground-truth test against the OPERA rasters (tests/test_insar_utils.py)
  - gdal=3.12
  - opera-utils=0.25.4   # data_prep: DISP-S1 download and reformatting
  - dem_stitcher=2.5.13  # data_prep: the DEM of the static layers
  - netcdf4=1.7
  - cartopy=0.25         # imported by CSI
  - jupyterlab
  - nbconvert
  - ipykernel
  - pytest
  - pip
  - pip:
      - okada4py==1.0.1    # CSI's dislocation solutions
      - ndsplines==0.3.0   # imported by CSI
