# USGS SFCVM v26.0, AS IS (not aligned; sensitivity run) (sfcvm_grid.py + write_sfcvm_griddb.py): SimpleGridDB,
# linear interpolation between grid points, one value per cell (basis order 0, set in pylithapp.cfg).
# vs floored at 150 m/s, Poisson's ratio capped at 0.40 (vp = min(vp, sqrt(6) vs)).
[pylithapp.problem.materials.elastic]
db_auxiliary_field = spatialdata.spatialdb.SimpleGridDB
db_auxiliary_field.description = SFCVM v26.0 as is
db_auxiliary_field.filename = spatialdb/mat_sfcvm_v26-0_asis.spatialdb
db_auxiliary_field.query_type = linear
